name: setup-witness
description: >
  The witness jobs' shared bring-up, single-sourced (was three identical copies
  in witness.yml): clang-20 + wasm32-wasi sysroot from Ubuntu 24.04's own repos,
  the cached wasm-EH libc++/libc++abi sysroot (rebuilt from wasi/toolchain/ on a
  cache miss), Node >= 24.15 (the standardized-exnref floor), and Playwright
  with the browsers the calling job names. The interactive-session mirror of
  this recipe is .claude/hooks/session-start.sh, which substitutes two hosts the
  web session's proxy blocks; keep the two in step when either changes.
inputs:
  browsers:
    description: Playwright browsers to install (space-separated), e.g. "chromium firefox".
    required: false
    default: chromium
  webkit:
    description: Set to 'best-effort' to also try webkit without failing the job.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: toolchain (clang-20 + wasm32-wasi sysroot)
      shell: bash
      run: |
        # deb-src enables the apt-get source fallback when GitHub downloads are rate-limited.
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
        sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list 2>/dev/null || true
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang-20 lld-20 llvm-20 libclang-rt-20-dev-wasm32 wasi-libc cmake ninja-build

    - name: cache wasm-EH libc++ sysroot
      id: sysroot
      uses: actions/cache@v4
      with:
        path: wasi-eh
        key: wasi-eh-llvm20.1.2-${{ hashFiles('wasi/toolchain/build-libcxx-eh.sh', 'wasi/toolchain/Platform/**', 'wasi/toolchain/eh-flags.sh', 'wasi/toolchain/setjmp/**') }}

    - name: build libc++ / libc++abi with wasm-EH
      if: steps.sysroot.outputs.cache-hit != 'true'
      shell: bash
      run: WORK="$RUNNER_TEMP/llvm-eh" PREFIX="$PWD/wasi-eh" wasi/toolchain/build-libcxx-eh.sh

    - uses: actions/setup-node@v4
      with:
        # 24.15 is the floor for the standardized exnref encoding by default.
        node-version: '>=24.15 <25'

    - name: playwright (${{ inputs.browsers }})
      shell: bash
      run: |
        npm i --no-save playwright@1.61.1
        npx playwright install --with-deps ${{ inputs.browsers }}

    - name: webkit (best-effort)
      # The #33 probe records "not installed" rather than failing.
      if: inputs.webkit == 'best-effort'
      shell: bash
      run: npx playwright install --with-deps webkit || echo "::warning::webkit install failed; #33 probe will skip WebKit"
