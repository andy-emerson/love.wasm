name: witness
# Re-run every witness on each push/PR to the trunk, so no behavioral claim
# rots silently. Step-by-step rationale lives with each witness script.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eh-witness:
    runs-on: ubuntu-24.04
    env:
      # Firefox is the sole non-V8 cross-check; a missing install must fail, not skip.
      WITNESS_REQUIRE_FIREFOX: '1'
    steps:
      - uses: actions/checkout@v4

      - name: toolchain (clang-20 + wasm32-wasi sysroot)
        run: |
          # deb-src enables the apt-get source fallback when GitHub downloads are rate-limited.
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-20 lld-20 llvm-20 libclang-rt-20-dev-wasm32 wasi-libc cmake ninja-build

      - name: cache wasm-EH libc++ sysroot
        id: sysroot
        uses: actions/cache@v4
        with:
          path: wasi-eh
          key: wasi-eh-llvm20.1.2-${{ hashFiles('wasi/toolchain/build-libcxx-eh.sh', 'wasi/toolchain/Platform/**', 'wasi/toolchain/eh-flags.sh', 'wasi/toolchain/setjmp/**') }}

      - name: build libc++ / libc++abi with wasm-EH
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: WORK="$RUNNER_TEMP/llvm-eh" PREFIX="$PWD/wasi-eh" wasi/toolchain/build-libcxx-eh.sh

      - uses: actions/setup-node@v4
        with:
          # 24.15 is the floor for the standardized exnref encoding by default.
          node-version: '>=24.15 <25'

      - name: chromium + firefox
        run: npm i --no-save playwright@1.61.1 && npx playwright install --with-deps chromium firefox

      - name: EH + SjLj witnesses (node + Chromium + Firefox)
        run: PREFIX="$PWD/wasi-eh" wasi/witness/run.sh

      - name: FreeType vendor witness
        run: PREFIX="$PWD/wasi-eh" wasi/vendor/freetype/run.sh

      - name: HarfBuzz vendor witness
        run: PREFIX="$PWD/wasi-eh" wasi/vendor/harfbuzz/run.sh

      - name: libogg vendor witness
        run: wasi/vendor/libogg/run.sh

      - name: libvorbis vendor witness
        run: wasi/vendor/libvorbis/run.sh

      - name: libmodplug vendor witness
        run: PREFIX="$PWD/wasi-eh" wasi/vendor/libmodplug/run.sh

  pump-witness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: source-drop provenance (verbatim at the PIN commit)
        run: |
          commit=$(awk '/^commit:/{print $2}' wasi/lua/upstream/PIN)
          echo "PIN: $commit"
          git init "$RUNNER_TEMP/lua.wasm" -q
          git -C "$RUNNER_TEMP/lua.wasm" remote add origin https://github.com/andy-emerson/lua.wasm
          git -C "$RUNNER_TEMP/lua.wasm" fetch -q --depth 1 origin "$commit"
          git -C "$RUNNER_TEMP/lua.wasm" checkout -q FETCH_HEAD
          diff -r "$RUNNER_TEMP/lua.wasm/src" wasi/lua/upstream/src
          echo "source drop is verbatim lua.wasm src/ at the pinned commit"

      - name: toolchain (clang-20 + wasm32-wasi sysroot)
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-20 lld-20 llvm-20 libclang-rt-20-dev-wasm32 wasi-libc cmake ninja-build

      - name: cache wasm-EH libc++ sysroot
        id: sysroot
        uses: actions/cache@v4
        with:
          path: wasi-eh
          key: wasi-eh-llvm20.1.2-${{ hashFiles('wasi/toolchain/build-libcxx-eh.sh', 'wasi/toolchain/Platform/**', 'wasi/toolchain/eh-flags.sh', 'wasi/toolchain/setjmp/**') }}

      - name: build libc++ / libc++abi with wasm-EH
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: WORK="$RUNNER_TEMP/llvm-eh" PREFIX="$PWD/wasi-eh" wasi/toolchain/build-libcxx-eh.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '>=24.15 <25'

      - name: chromium + firefox + webkit
        # webkit is best-effort: the #33 probe records "not installed" rather than failing.
        run: |
          npm i --no-save playwright@1.61.1
          npx playwright install --with-deps chromium firefox
          npx playwright install --with-deps webkit || echo "::warning::webkit install failed; #33 probe will skip WebKit"

      - name: pump witness (step 2)
        run: PREFIX="$PWD/wasi-eh" wasi/pump/run.sh

      - name: boot witness (step 3)
        run: PREFIX="$PWD/wasi-eh" wasi/boot/run.sh

      - name: love_fs seam, read round-trip (step 6.1)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run.sh

      - name: real love.filesystem (step 6.2)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-fs2.sh

      - name: real love.event/keyboard/mouse (step 6.4)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-input.sh

      - name: real love.joystick/gamepad (step 6.5)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-joystick.sh

      - name: preview-warn mechanism + love.sensor stub (issue 27)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-sensor.sh

      - name: real love.timer/love.system (step 6.6a)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-timer-system.sh

      - name: embedding contract — write path + reload (step 6.7)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-embed.sh

      - name: love.audio playback + mic
        run: PREFIX="$PWD/wasi-eh" wasi/audio/run.sh

      - name: love.physics (Box2D)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-physics.sh

      - name: love.sound decoders
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-sound.sh

      - name: love.filesystem directory enumeration (fs_list)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-fs-list.sh

      - name: resample-delegation probe (issue 33)
        # A probe, not a gate: exits 0 regardless; findings land in the log.
        run: node wasi/audio/probe-resample-xengine.mjs

  graphics-witness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: toolchain (clang-20 + wasm32-wasi sysroot)
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-20 lld-20 llvm-20 libclang-rt-20-dev-wasm32 wasi-libc cmake ninja-build

      - name: cache wasm-EH libc++ sysroot
        id: sysroot
        uses: actions/cache@v4
        with:
          path: wasi-eh
          key: wasi-eh-llvm20.1.2-${{ hashFiles('wasi/toolchain/build-libcxx-eh.sh', 'wasi/toolchain/Platform/**', 'wasi/toolchain/eh-flags.sh', 'wasi/toolchain/setjmp/**') }}

      - name: build libc++ / libc++abi with wasm-EH
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: WORK="$RUNNER_TEMP/llvm-eh" PREFIX="$PWD/wasi-eh" wasi/toolchain/build-libcxx-eh.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '>=24.15 <25'

      - name: chromium
        run: npm i --no-save playwright@1.61.1 && npx playwright install --with-deps chromium

      - name: love.graphics on real WebGL2 (step 4, legs 4.1a-4.20)
        run: PREFIX="$PWD/wasi-eh" wasi/graphics/run.sh

      - name: real love.window + captureScreenshot (step 6.3)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-win.sh

      - name: first full main.lua frame (step 6.6b)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-frame.sh

      - name: union real game (pre-step-7 capstone)
        run: PREFIX="$PWD/wasi-eh" wasi/platform/run-game.sh

      - name: interactive shell (Beta step 1)
        # Builds the union artifact the next three steps reuse.
        run: PREFIX="$PWD/wasi-eh" OUT="$PWD/wasi/shell/love-game.wasm" wasi/shell/run.sh

      - name: corpus parity vs expected-fail list (Beta step 3)
        run: PREFIX="$PWD/wasi-eh" WASM="$PWD/wasi/shell/love-game.wasm" wasi/corpus/run.sh

      - name: save durability — write, reload the page, read back (issue 55)
        run: PREFIX="$PWD/wasi-eh" WASM="$PWD/wasi/shell/love-game.wasm" wasi/shell/run-durability.sh

      - name: main.lua hotswap — new body next call, state intact (issue 56)
        run: PREFIX="$PWD/wasi-eh" WASM="$PWD/wasi/shell/love-game.wasm" wasi/shell/run-hotswap.sh
