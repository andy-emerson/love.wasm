<!doctype html>
<!-- The interactive shell's page (Beta step 1). Deliberately plain: this is a
     game player, and every pixel of chrome here is a pixel that is not the game.
     The canvas is created by love.window.setMode, not by this markup, because the
     game's conf.lua owns its size. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>love.wasm — player</title>
<style>
  :root { color-scheme: dark light; }
  body {
    margin: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #14161a; color: #d6d9de;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 1rem;
    padding: .5rem .75rem; border-bottom: 1px solid #2a2e35;
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  #status { padding: 0 .5rem; border-radius: 3px; background: #2a2e35; }
  #status.good { background: #1d3a24; color: #8fd39b; }
  #status.bad  { background: #3a1d1d; color: #e59b9b; }
  button {
    font: inherit; color: inherit; background: #22262d;
    border: 1px solid #343941; border-radius: 3px; padding: .1rem .6rem; cursor: pointer;
  }
  button:hover { background: #2a2f37; }
  #stage {
    flex: 1; display: grid; place-items: center; padding: 1rem; min-height: 0;
  }
  /* The backing store is the game's; scale to fit without distorting it, and keep
     pixel art crisp rather than smoothing it. */
  #stage canvas {
    max-width: 100%; max-height: 100%;
    image-rendering: pixelated; background: #000;
    outline: none; border: 1px solid #2a2e35;
  }
  #log {
    /* A FIXED height, not max-height. #stage is flex:1 and centres the canvas,
       so a log that grows shrinks the stage and slides the canvas — which moves
       the game under the player's finger, and shifts every mouse and touch
       coordinate mid-play. Reserving the space keeps the game area still. */
    margin: 0; padding: .5rem .75rem; height: 11rem; overflow-y: auto;
    white-space: pre-wrap; border-top: 1px solid #2a2e35;
    background: #101216; color: #98a0ab; font-size: 12px;
  }
</style>
</head>
<body>
  <header>
    <h1>love.wasm</h1>
    <span id="status">starting…</span>
    <span style="flex:1"></span>
    <button id="quit" title="Send a quit event to the game">quit</button>
  </header>
  <div id="stage"></div>
  <pre id="log"></pre>
  <script type="module" src="./player.mjs"></script>
</body>
</html>
